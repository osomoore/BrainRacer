<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art pick</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#323746;--fg:#e8eaf0;--dim:#9aa1b5;--acc:#ffb020;--ok:#3ccf7a;--sky:#6ea8e6}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{flex-shrink:0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header select,header button,header input{background:#262a36;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:inherit}
header button{cursor:pointer}header button:hover{border-color:var(--acc)}
.count{font-weight:700;color:var(--acc)}.sp{flex:1}
main{flex:1;min-height:0;overflow:auto;padding:12px}
main > * + *{margin-top:10px}
.title{font-size:14px;color:var(--dim);word-break:break-all}.title b{color:var(--fg);font-size:17px}
.row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.card.cand{cursor:pointer}.card.cand:hover{border-color:var(--acc)}
.card.chosen{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.card h4{margin:0;font-size:14px;color:var(--dim)}.card h4 i{display:inline-block;background:var(--acc);color:#000;border-radius:5px;padding:0 7px;font-style:normal;font-weight:800;margin-right:6px}
.card.chosen h4 i{background:var(--ok)}
.pic{display:flex;align-items:center;justify-content:center;border-radius:6px;padding:6px;min-width:120px}
.pic img{display:block}
.bg-checker{background:repeating-conic-gradient(#bbb 0 25%,#eee 0 50%) 0 0/20px 20px}
.bg-sky{background:var(--sky)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{background:#262a36;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
.actions button.on{border-color:var(--ok);background:#1f3a2b}.actions button:hover{border-color:var(--acc)}
.comment-editor{flex-shrink:0;padding:8px 12px 12px;background:var(--panel);border-top:1px solid var(--line)}
.comment-editor .actions{margin-bottom:6px}
.comment-editor label{font-weight:700}
.comment-editor textarea{display:block;width:min(680px,100%);height:92px;overflow:auto;resize:none;background:#262a36;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:18px/1.35 system-ui,sans-serif}
.help{color:var(--dim);font-size:13px}kbd{background:#262a36;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.status{font-weight:700}.st-shape{color:#ff8b6b}.st-more{color:#7fc4ff}.st-seed{color:var(--ok)}.st-none{color:var(--dim)}
.empty{padding:40px;color:var(--dim)}
</style></head><body>
<header>
  <span class="count" id="count">-</span>
  <button id="prev" title="Left arrow">&larr; Prev</button><button id="next" title="Right arrow">Next &rarr;</button>
  <label>Workshop <select id="fWs"></select></label>
  <label>Aspect <select id="fAsp"></select></label>
  <label>Part <select id="fPart"></select></label>
  <label>View <select id="fView"></select></label>
  <label>Show <select id="fSt"><option value="all">all</option><option value="open">not voted yet</option><option value="voted">voted</option><option value="more">wants more</option></select></label>
  <span class="sp"></span>
  <label>Zoom <select id="zoom"><option>1</option><option selected>1.5</option><option>2</option><option>3</option><option>4</option></select></label>
  <label><input type="checkbox" id="auto" checked> auto-advance</label>
  <span class="help"><kbd>1</kbd>-<kbd>9</kbd> pick &middot; <kbd>0</kbd> keep code shape &middot; <kbd>M</kbd> more &middot; <kbd>U</kbd> clear vote &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &middot; <kbd>B</kbd> background &middot; <kbd>Z</kbd> zoom &middot; <kbd>C</kbd> comment</span>
</header>
<main id="main"></main>
<footer class="comment-editor" id="commentEditor" hidden>
  <div class="actions">
    <label for="comment">Comment</label>
    <button id="clearComment" type="button">Clear comment</button>
    <span class="help" id="commentHelp">Saves when you leave the field or press Ctrl+Enter.</span>
  </div>
  <textarea id="comment" aria-describedby="commentHelp" placeholder="Optional feedback for this job"></textarea>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let index = { jobs: {} }, picks = {}, list = [], cur = 0, bgMode = 'checker';
const status = (k) => { const p = picks[k]; if (!p || p.pick === 'pending') return 'none'; return p.pick === 'shape' ? 'shape' : p.pick === 'more' ? 'more' : 'seed'; };
const cache = Date.now();
const imgUrl = (j, name) => '/cand/' + encodeURIComponent(j.file) + '/' + name + '?' + cache;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

function fillSelect(sel, values, label) {
  const v = sel.value;
  sel.innerHTML = '<option value="">' + label + '</option>' + values.map((x) => '<option>' + esc(x) + '</option>').join('');
  if (values.includes(v)) sel.value = v;
}
function allJobs() { return Object.entries(index.jobs).filter(([, j]) => j.seeds && j.seeds.length).map(([key, j]) => ({ key, ...j })); }
function refreshFilters() {
  const js = allJobs(); const uniq = (f) => [...new Set(js.map(f).filter(Boolean))].sort();
  fillSelect($('fWs'), uniq((j) => j.workshop), 'all'); fillSelect($('fAsp'), uniq((j) => j.aspect), 'all');
  fillSelect($('fPart'), uniq((j) => j.part), 'all'); fillSelect($('fView'), uniq((j) => j.view), 'all');
}
function applyFilter(keepKey) {
  const f = { ws: $('fWs').value, asp: $('fAsp').value, part: $('fPart').value, view: $('fView').value, st: $('fSt').value };
  list = allJobs().filter((j) => (!f.ws || j.workshop === f.ws) && (!f.asp || j.aspect === f.asp) && (!f.part || j.part === f.part) && (!f.view || j.view === f.view) &&
    (f.st === 'all' || (f.st === 'open' && status(j.key) === 'none') || (f.st === 'voted' && status(j.key) !== 'none') || (f.st === 'more' && status(j.key) === 'more')));
  list.sort((a, b) => (a.key < b.key ? -1 : 1));
  const i = keepKey ? list.findIndex((j) => j.key === keepKey) : -1;
  cur = i >= 0 ? i : Math.min(cur, Math.max(0, list.length - 1));
  render();
}
function counts() { const js = allJobs(); const v = js.filter((j) => status(j.key) !== 'none').length; return v + '/' + js.length + ' voted'; }
const bboxes = {};
function getBBox(j) {
  if (bboxes[j.key]) return Promise.resolve(bboxes[j.key]);
  const full = { x: 0, y: 0, w: j.w, h: j.h };
  if (!j.shape) return Promise.resolve((bboxes[j.key] = full));
  return new Promise((ok) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) if (d[(y * c.width + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      bboxes[j.key] = x1 < 0 ? full : { x: Math.max(0, x0 - 4), y: Math.max(0, y0 - 4), w: Math.min(c.width, x1 + 5) - Math.max(0, x0 - 4), h: Math.min(c.height, y1 + 5) - Math.max(0, y0 - 4) };
      ok(bboxes[j.key]);
    };
    im.onerror = () => ok((bboxes[j.key] = full));
    im.src = imgUrl(j, j.shape);
  });
}
let renderSeq = 0;
let commentKey;
let pendingWrite = Promise.resolve();
async function render() {
  const seq = ++renderSeq;
  const j = list[cur];
  if (j) await getBBox(j);
  if (seq !== renderSeq) return;
  if (commentKey !== j?.key) {
    saveComment();
    await pendingWrite;
  }
  if (seq !== renderSeq) return;
  const main = $('main');
  $('count').textContent = counts() + '  |  showing ' + (list.length ? cur + 1 : 0) + '/' + list.length;
  $('commentEditor').hidden = !j;
  if (commentKey !== j?.key) {
    saveComment();
    commentKey = j?.key;
    $('comment').value = j ? picks[j.key]?.comment ?? '' : '';
    main.scrollTo(0, 0);
  }
  if (!j) { main.innerHTML = '<div class="empty">No jobs match. Generate candidates with <code>npm run art:paint -- --candidates 4 --only "..."</code> or change the filters.</div>'; return; }
  const p = picks[j.key], st = status(j.key), z = Number($('zoom').value);
  const stTxt = st === 'none' ? 'not voted' : st === 'shape' ? 'keep CODE SHAPE' : st === 'more' ? 'wants MORE candidates' : 'picked seed ' + p.pick;
  const bg = bgMode === 'checker' ? 'bg-checker' : 'bg-sky';
  const bb = bboxes[j.key];
  // show only the painted area (the texture has transparent padding); image offset inside a clipping box
  const frame = (url) => '<div style="position:relative;overflow:hidden;width:' + Math.round(bb.w * z) + 'px;height:' + Math.round(bb.h * z) + 'px"><img style="position:absolute;left:' + (-Math.round(bb.x * z)) + 'px;top:' + (-Math.round(bb.y * z)) + 'px;width:' + Math.round(j.w * z) + 'px;height:' + Math.round(j.h * z) + 'px" src="' + url + '"></div>';
  const cards = j.seeds.map((s, i) => {
    const pattern = j.patterns?.[s];
    const preview = pattern
      ? '<details><summary>Pattern ' + esc(String(pattern.seed)) + '</summary><div class="pic ' + bg + '">' + frame(imgUrl(j, pattern.shape)) + '</div></details>'
      : '';
    return '<div class="card cand ' + (p && p.pick === s ? 'chosen' : '') + '" data-i="' + i + '"><h4><i>' + (i + 1) + '</i>seed ' + s + '</h4><div class="pic ' + bg + '">' + frame(imgUrl(j, s + '.png')) + '</div>' + preview + '</div>';
  }).join('');
  const shape = j.shape ? '<div class="card ' + (p && p.pick === 'shape' ? 'chosen' : '') + '"><h4><i>0</i>code shape</h4><div class="pic ' + bg + '">' + frame(imgUrl(j, j.shape)) + '</div></div>' : '';
  main.innerHTML = '<div class="title"><b>' + esc(j.part) + ' ' + esc(j.view || '') + '</b> &middot; ' + esc(j.workshop) + ' / ' + esc(j.aspect) + '<br>' + esc(j.key) + '</div>' +
    '<div class="status st-' + st + '">' + stTxt + '</div>' +
    '<div class="row">' + shape + cards + '</div>' +
    '<div class="actions"><button data-a="shape" class="' + (st === 'shape' ? 'on' : '') + '">0 Keep code shape (reject all)</button><button data-a="more" class="' + (st === 'more' ? 'on' : '') + '">M Need more candidates</button><button data-a="clear">U Clear vote</button></div>' +
    '<div class="help">' + (j.prompt ? 'Prompt: ' + esc(j.prompt) : '') + '</div>';
  main.querySelectorAll('.cand').forEach((el) => { el.onclick = (e) => { if (!e.target.closest('details')) vote(j.seeds[Number(el.dataset.i)]); }; });
  main.querySelectorAll('[data-a]').forEach((b) => { b.onclick = () => vote(b.dataset.a === 'clear' ? null : b.dataset.a); });
}
async function post(key, pick, comment) {
  const r = await fetch('/api/pick', { method: 'POST', body: JSON.stringify({ key, pick, comment }) });
  if (!r.ok) throw new Error('Could not save art feedback (' + r.status + ')');
  picks = await r.json();
}
function queueWrite(write) {
  const request = pendingWrite.then(write);
  pendingWrite = request.catch(console.error);
  return request;
}
function saveComment() {
  if (commentKey === undefined) return;
  const key = commentKey;
  const comment = $('comment').value.trim();
  queueWrite(() => {
    const p = picks[key];
    if ((p?.comment ?? '') !== comment) return post(key, p && p.pick !== 'pending' ? p.pick : null, comment);
  });
}
async function vote(pick) {
  const j = list[cur]; if (!j) return;
  if (j.key !== commentKey) return;
  const comment = $('comment').value;
  await queueWrite(() => post(j.key, pick, comment));
  if (list[cur]?.key !== j.key) { render(); return; }
  if (pick !== null && $('fSt').value === 'open') applyFilter();
  else if (pick !== null && $('auto').checked) move(1);
  else render();
}
$('comment').onkeydown = (e) => {
  if (e.key === 'Escape' || (e.key === 'Enter' && e.ctrlKey)) {
    e.preventDefault();
    e.target.blur();
  }
};
$('comment').onblur = saveComment;
$('clearComment').onclick = () => {
  $('comment').value = '';
  saveComment();
};
function move(d) { cur = Math.max(0, Math.min(list.length - 1, cur + d)); render(); }
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || (e.key === 'Enter' && e.target.tagName === 'BUTTON') || e.ctrlKey || e.altKey || e.metaKey) return;
  const j = list[cur]; const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'enter') { move(1); e.preventDefault(); }
  else if (k === 'arrowleft') { move(-1); e.preventDefault(); }
  else if (k === '0') vote('shape');
  else if (k === 'm') vote('more');
  else if (k === 'u') vote(null);
  else if (k === 'b') { bgMode = bgMode === 'checker' ? 'sky' : 'checker'; render(); }
  else if (k === 'z') { const s = $('zoom'); s.selectedIndex = (s.selectedIndex + 1) % s.options.length; render(); }
  else if (k === 'c') { e.preventDefault(); $('comment').focus(); }
  else if (/^[1-9]$/.test(k) && j && j.seeds[Number(k) - 1] !== undefined) vote(j.seeds[Number(k) - 1]);
});
['fWs', 'fAsp', 'fPart', 'fView', 'fSt'].forEach((id) => { $(id).onchange = () => applyFilter(); });
$('zoom').onchange = render; $('prev').onclick = () => move(-1); $('next').onclick = () => move(1);
(async () => {
  index = await (await fetch('/api/index')).json();
  picks = await (await fetch('/api/picks')).json();
  refreshFilters(); applyFilter();
})();
</script></body></html>
